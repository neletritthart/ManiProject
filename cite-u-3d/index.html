<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cité U en 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="cite-u-3d.css">
</head>
<body>
<div id="scene"><div class="loading">Construction de la maquette…</div></div>
<div id="labels"></div>
<div class="tip" id="tip" hidden></div>

<aside class="panel" aria-label="Guide du campus">
  <div class="head">
    <div class="eyebrow">Paris 14e · Boulevard Jourdan</div>
    <h1>Cité U <span>en 3D</span></h1>
    <p class="sub">Aperçu généré depuis OpenStreetMap. Fais tourner la maquette, clique une maison ou un lieu pour le retrouver.</p>
  </div>
  <div class="controls">
    <input class="search" id="q" type="search" placeholder="Chercher une maison, un service…" autocomplete="off" aria-label="Chercher">
    <div class="chips" id="chips"></div>
  </div>
  <div id="card" hidden></div>
  <div class="list" id="list"></div>
</aside>

<div class="tools">
  <a class="btn" href="../index.html" style="text-decoration:none">← Fast Track</a>
  <button class="btn" id="reset" type="button">Vue d'ensemble</button>
</div>
<div class="credit">Données © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">contributeurs OpenStreetMap</a> · hauteurs parfois estimées</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/utils/BufferGeometryUtils.js"></script>
<script src="cite-u-3d.js"></script>
</body>
</html>
